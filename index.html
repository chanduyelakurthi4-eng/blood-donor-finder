<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blood Donor Finder</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #c62828;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        header h1 {
            margin-bottom: 10px;
            font-size: 32px;
        }

        header p {
            font-size: 17px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #c62828;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #c62828;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            background: #c62828;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #8e0000;
        }

        .donor {
            border: 1px solid #ddd;
            border-left: 5px solid #c62828;
            padding: 15px;
            margin-top: 15px;
            border-radius: 6px;
            background: #fffafa;
        }

        .donor p {
            margin: 7px 0;
        }

        .available {
            color: green;
            font-weight: bold;
        }

        .no-result {
            color: #c62828;
            font-weight: bold;
            margin-top: 15px;
        }

        .success {
            color: green;
            font-weight: bold;
            margin-top: 15px;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #222;
            color: white;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 25px;
            }

            .container {
                width: 95%;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🩸 Blood Donor Finder</h1>
    <p>Find available blood donors near you</p>
</header>

<div class="container">

    <!-- SEARCH DONOR -->
    <div class="card">

        <h2>🔎 Search Blood Donor</h2>

        <label for="searchBlood">Blood Group</label>

        <select id="searchBlood">
            <option value="">Select Blood Group</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
        </select>

        <label for="searchCity">City</label>

        <input
            type="text"
            id="searchCity"
            placeholder="Enter city"
        >

        <button onclick="searchDonor()">
            Search Donor
        </button>

        <div id="results"></div>

    </div>


    <!-- REGISTER DONOR -->
    <div class="card">

        <h2>🩸 Register as Donor</h2>

        <label for="name">Donor Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
        >

        <label for="bloodGroup">Blood Group</label>

        <select id="bloodGroup">

            <option value="">
                Select Blood Group
            </option>

            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>

        </select>

        <label for="city">City</label>

        <input
            type="text"
            id="city"
            placeholder="Enter city"
        >

        <label for="phone">Phone Number</label>

        <input
            type="tel"
            id="phone"
            placeholder="Enter phone number"
        >

        <button onclick="registerDonor()">
            Register Donor
        </button>

        <p id="message"></p>

    </div>

</div>


<footer>
    <p>© 2026 Blood Donor Finder</p>
</footer>


<script>

    // ==========================================
    // SAMPLE DONOR DATA
    // ==========================================

    let defaultDonors = [

        {
            name: "Rahul",
            bloodGroup: "O+",
            city: "Vijayawada",
            phone: "9000000001",
            available: true
        },

        {
            name: "Priya",
            bloodGroup: "A+",
            city: "Vijayawada",
            phone: "9000000002",
            available: true
        },

        {
            name: "Kiran",
            bloodGroup: "B+",
            city: "Guntur",
            phone: "9000000003",
            available: true
        },

        {
            name: "Anu",
            bloodGroup: "O-",
            city: "Vijayawada",
            phone: "9000000004",
            available: false
        }

    ];


    // ==========================================
    // LOAD DONORS FROM LOCAL STORAGE
    // ==========================================

    let donors =
        JSON.parse(localStorage.getItem("donors"));

    if (!donors) {

        donors = defaultDonors;

        localStorage.setItem(
            "donors",
            JSON.stringify(donors)
        );
    }


    // ==========================================
    // SEARCH DONOR FUNCTION
    // ==========================================

    function searchDonor() {

        let bloodGroup =
            document.getElementById("searchBlood").value;

        let city =
            document.getElementById("searchCity")
            .value
            .trim();

        let results =
            document.getElementById("results");


        // Clear old results

        results.innerHTML = "";


        // Validate search fields

        if (bloodGroup === "" || city === "") {

            results.innerHTML =
                "<p class='no-result'>" +
                "Please select blood group and enter city." +
                "</p>";

            return;
        }


        let found = false;


        // Search donors

        donors.forEach(function(donor) {

            if (

                donor.bloodGroup.toLowerCase()
                === bloodGroup.toLowerCase()

                &&

                donor.city.toLowerCase()
                === city.toLowerCase()

                &&

                donor.available === true

            ) {

                found = true;


                results.innerHTML += `

                    <div class="donor">

                        <p>
                            <strong>Name:</strong>
                            ${escapeHTML(donor.name)}
                        </p>

                        <p>
                            <strong>Blood Group:</strong>
                            ${escapeHTML(donor.bloodGroup)}
                        </p>

                        <p>
                            <strong>City:</strong>
                            ${escapeHTML(donor.city)}
                        </p>

                        <p>
                            <strong>Phone:</strong>
                            ${escapeHTML(donor.phone)}
                        </p>

                        <p class="available">
                            Availability:
                            Available ✅
                        </p>

                    </div>

                `;
            }

        });


        // No donor found

        if (!found) {

            results.innerHTML =
                "<p class='no-result'>" +
                "No available donor found." +
                "</p>";

        }

    }


    // ==========================================
    // REGISTER DONOR FUNCTION
    // ==========================================

    function registerDonor() {

        let name =
            document.getElementById("name")
            .value
            .trim();

        let bloodGroup =
            document.getElementById("bloodGroup")
            .value;

        let city =
            document.getElementById("city")
            .value
            .trim();

        let phone =
            document.getElementById("phone")
            .value
            .trim();

        let message =
            document.getElementById("message");


        // Clear previous message

        message.innerHTML = "";


        // Validate fields

        if (
            name === "" ||
            bloodGroup === "" ||
            city === "" ||
            phone === ""
        ) {

            message.style.color = "red";

            message.innerHTML =
                "Please fill all fields.";

            return;
        }


        // Validate phone number

        if (!/^[0-9]{10}$/.test(phone)) {

            message.style.color = "red";

            message.innerHTML =
                "Please enter a valid 10-digit phone number.";

            return;
        }


        // Create donor object

        let newDonor = {

            name: name,

            bloodGroup: bloodGroup,

            city: city,

            phone: phone,

            available: true

        };


        // Add donor

        donors.push(newDonor);


        // Save donors

        localStorage.setItem(
            "donors",
            JSON.stringify(donors)
        );


        // Show success message

        message.style.color = "green";

        message.innerHTML =
            "Donor registered successfully! ✅";


        // Clear form

        document.getElementById("name").value = "";

        document.getElementById("bloodGroup").value = "";

        document.getElementById("city").value = "";

        document.getElementById("phone").value = "";

    }


    // ==========================================
    // SECURITY FUNCTION
    // Prevent HTML injection when displaying data
    // ==========================================

    function escapeHTML(value) {

        return String(value)

            .replace(/&/g, "&amp;")

            .replace(/</g, "&lt;")

            .replace(/>/g, "&gt;")

            .replace(/"/g, "&quot;")

            .replace(/'/g, "&#039;");

    }

</script>

</body>
</html>
